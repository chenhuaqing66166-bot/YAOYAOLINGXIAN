:root{color-scheme:light;--ink:#25312c;--muted:#7b8074;--paper:#f3f0e8;--line:#dadbd0;--green:#485d48;--red:#b95a3c}
*{box-sizing:border-box}body{margin:0;background:#e8e7de;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #889f70;outline-offset:3px}
.app{max-width:1440px;margin:24px auto;padding:0 20px}.shell{overflow:hidden;border-radius:18px;background:var(--paper);box-shadow:0 16px 64px #37403317;border:1px solid #fff8}
.header{height:77px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;gap:20px}.brand{display:flex;align-items:center;gap:17px}.brand-number{font:500 33px/1 ui-monospace,monospace;letter-spacing:-2px}.brand-title{border-left:1px solid #c9cec2;padding-left:17px;font-size:15px;letter-spacing:2px}.brand-title small{display:block;font-size:9px;letter-spacing:2.6px;color:var(--muted);margin-top:6px}.header-actions{display:flex;align-items:center;gap:8px}.live{font-size:10px;letter-spacing:1.6px;margin-right:14px;display:flex;align-items:center;gap:6px}.live:before{content:"";width:5px;height:5px;border-radius:50%;background:#708858}.quiet{border:1px solid var(--line);background:none;border-radius:7px;padding:9px 11px;color:#596452;font-size:11px}.quiet:hover{background:#e5e7dc}
.stage{position:relative;aspect-ratio:1600/910;overflow:hidden;background:#849b8e;isolation:isolate;user-select:none}.world{position:absolute;inset:-.7%;transform-origin:57% 24%;will-change:transform}.road,.cabin{position:absolute;inset:0;width:100%;height:100%;display:block}.cabin{pointer-events:none;will-change:transform}.grade{position:absolute;inset:0;background:linear-gradient(0deg,#101911a3,transparent 30%,transparent 82%,#252d1110);pointer-events:none}.speed-shade{position:absolute;inset:0;box-shadow:inset 0 0 90px #17201b;opacity:0;pointer-events:none}

.foot{position:absolute;right:22px;bottom:22px;width:18%;min-width:135px;max-width:230px;aspect-ratio:1.16;border-radius:12px;border:1px solid #d6c3938c;overflow:hidden;background:#141713;box-shadow:0 8px 36px #0005}.pedal-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .08s}.pedal-photo.broken{opacity:0;visibility:hidden}.app[data-mode=broken] .pedal-photo.broken,.app[data-mode=glue] .pedal-photo.broken{opacity:1;visibility:visible}.foot-shade{position:absolute;inset:0;background:linear-gradient(#10180ddb,transparent 32%,transparent 70%,#10180df2)}.foot-title{position:absolute;left:11px;top:9px;color:#e8e6d6;font-size:10px;letter-spacing:1px}.foot-title span{color:#a6b59a;margin-left:7px;font:9px monospace}.foot-status{position:absolute;bottom:10px;left:11px;color:#cee3b7;font-size:10px}.app[data-mode=broken] .foot-status{color:#ffbf98}.pedal-pressure{position:absolute;bottom:22%;height:35%;width:27%;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .04s}.gas-pressure{right:12%;background:linear-gradient(0deg,#b8d99877,transparent);box-shadow:0 5px 13px #c4dc9166;transform:rotate(-7deg)}.brake-pressure{left:14%;bottom:44%;width:35%;height:24%;background:linear-gradient(0deg,#d1e3ac66,transparent);box-shadow:0 5px 13px #c4dc9166;transform:rotate(-7deg)}
.bottle{position:absolute;left:45%;top:18%;height:44%;width:16%;background:linear-gradient(90deg,#aeb374,#eee9bf,#c4c789);border-radius:6px;transform:rotate(30deg);opacity:0;box-shadow:0 5px 12px #0008}.bottle:before{content:"胶水";position:absolute;background:#647553;color:#f2f0d9;font-size:9px;left:0;right:0;top:28%;padding:6px 0;text-align:center}.bottle:after{content:"";position:absolute;top:99%;left:27%;width:46%;height:26%;background:#e7ebaf;clip-path:polygon(0 0,100% 0,65% 100%,35% 100%)}.app[data-mode=glue] .bottle{opacity:1}.repair-track{position:absolute;bottom:10px;left:10px;right:10px;height:4px;background:#536044;display:none;border-radius:4px;overflow:hidden}.repair-track i{display:block;background:#d3e8ae;height:100%;width:0}.app[data-mode=glue] .repair-track{display:block}.app[data-mode=glue] .foot-status{bottom:21px}

.controls{display:grid;grid-template-columns:1fr 1fr .9fr;gap:12px;padding:19px 24px 17px}.pedal{position:relative;overflow:hidden;text-align:left;min-height:80px;border:1px solid #cdd2c3;border-radius:11px;background:#e9ecdf;color:var(--ink);padding:15px 18px;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .12s,box-shadow .12s,background .12s}.pedal:hover{background:#e2e7d5}.pedal[data-active=true]{transform:translateY(2px);box-shadow:inset 0 2px 7px #283b232a}.pedal.brake{background:#344337;border-color:#344337;color:#f1f2dc}.pedal.brake:hover{background:#2c3e2f}.pedal.glue{background:transparent}.pedal:disabled{opacity:.4;cursor:default}.pedal-label{display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative;z-index:1}.pedal-label strong{font-size:15px;font-weight:500;letter-spacing:1px}.pedal-label kbd{font:10px ui-monospace,monospace;border:1px solid currentColor;opacity:.65;padding:3px 5px;border-radius:4px}.pedal small{display:block;font-size:10px;opacity:.64;margin-top:8px;position:relative;z-index:1}.pedal-fill{position:absolute;left:0;bottom:0;height:3px;width:0;background:#8ba461}.brake .pedal-fill{background:#d2ddb0}.glue .pedal-fill{background:#b8a369}
.footer{display:flex;justify-content:space-between;gap:18px;font-size:10px;color:#818678;padding:0 25px 17px;line-height:1.6}.footer span:last-child{text-align:right}.loading{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;background:#26352f;color:#e5e7d5;font-size:13px;letter-spacing:2px;z-index:10}.loading[hidden]{display:none}

@media(prefers-reduced-motion:reduce){.world,.cabin{will-change:auto}.pedal{transition:none}}

 function frame(now){
   const dt=last?Math.min((now-last)/1000,.05):0;last=now;
   if(ready&&!paused){
     engine.update(dt);road.draw(engine.distance);
     // Photo cabin and outside scenery react separately to acceleration and braking.
     const bob=reduced.matches?0:Math.sin(engine.distance*1.5)*Math.min(.65,engine.speed*.025);
     const shock=reduced.matches?0:Math.sin(engine.elapsed*77)*engine.impact*3;
     const pitch=reduced.matches?0:engine.pitch;
     $('.world').style.transform=`translateY(${pitch*3+bob+shock}px) scale(${1+Math.max(0,pitch)*.002})`;
     $('.cabin').style.transform=`translateY(${pitch*5+bob*.3}px)`;
     $('.speed-shade').style.opacity=String(Math.min(.12,engine.speed/250));
     if(engine.mode!==previousMode){previousMode=engine.mode;paintUI();}
   }
   uiTimer+=dt;if(uiTimer>=1/30){paintUI();uiTimer=0;}
   requestAnimationFrame(frame);
 }
